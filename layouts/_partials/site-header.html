<header class="site-header">
  <div class="site-header-content container flex align-center justify-between">
    <a class="site-header-brand flex align-center" href="{{ partial `docs/links/home` . }}">
      <img src="{{ `favicon.png` | relURL }}" alt="" />
      <span>{{ .Site.Title }}</span>
    </a>

    <nav class="site-header-nav flex align-center" aria-label="Luanti">
      {{ range .Site.Menus.after }}
      <a class="site-header-link" href="{{ .URL }}">{{ .Name }}</a>
      {{ end }}
      <button type="button" class="site-header-theme" id="site-theme-toggle"></button>
    </nav>
  </div>
</header>

<script>
  (function () {
    const modes = { auto: "◐ Auto", light: "☀ Light", dark: "☾ Dark" };
    const order = Object.keys(modes);
    const root = document.documentElement;
    const button = document.getElementById("site-theme-toggle");
    const show = () => {
      const mode = modes[root.dataset.theme] ? root.dataset.theme : "auto";
      const [icon, label] = modes[mode];
      button.innerHTML = `${icon} <span class="site-header-theme-label">${label}</span>`;
      button.title = "Color theme: " + mode;
    };
    button.addEventListener("click", () => {
      const current = order.indexOf(root.dataset.theme);
      root.dataset.theme = order[(current + 1) % order.length];
      try {
        localStorage.setItem("theme", root.dataset.theme);
      } catch (e) { }
      show();
    });
    show();
  })();
</script>
