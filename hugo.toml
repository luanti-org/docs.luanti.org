baseURL = 'https://docs.luanti.org/'
locale = 'en-us'
title = 'Luanti Documentation'
theme = ['hugo-notice', 'hugo-book']
enableGitInfo = true

[params]
    BookTheme = 'auto'
    BookSection = '*'
    BookRepo = 'https://github.com/luanti-org/docs.luanti.org'
    BookEditPath = 'edit/master'

# Links shown in the site header, and at the bottom of the side menu on narrow screens
[menu]
    [[menu.after]]
        name = 'Luanti'
        url = 'https://www.luanti.org/'
        weight = 10
        params = { class = 'site-header-link' }
    [[menu.after]]
        name = 'ContentDB'
        url = 'https://content.luanti.org/'
        weight = 20
        params = { class = 'site-header-link' }
    [[menu.after]]
        name = 'Forums'
        url = 'https://forum.luanti.org/'
        weight = 30
        params = { class = 'site-header-link' }
    [[menu.after]]
        name = 'GitHub'
        url = 'https://github.com/luanti-org/docs.luanti.org'
        weight = 40
        params = { class = 'site-header-link' }

[module]
    [[module.mounts]]
        source = 'content'
        target = 'content'
    [[module.mounts]]
        source = 'external/flint/docs'
        target = 'content/for-creators/flint'
    [[module.mounts]]
        source = 'external/luma/docs'
        target = 'content/for-server-hosts/luma'
