baseURL = 'https://docs.luanti.org/'
locale = 'en-us'
title = 'Luanti Documentation'
theme = ['hextra']
enableGitInfo = true

[params]
    [params.navbar]
        displayTitle = true
        displayLogo = true
        [params.navbar.logo]
            path = 'luanti.svg'
    [params.editURL]
        enable = true
        base = 'https://github.com/luanti-org/docs.luanti.org/edit/master/content'
    [params.footer]
        displayPoweredBy = false

# Links in the site header
[menu]
    [[menu.main]]
        name = 'Luanti'
        url = 'https://www.luanti.org/'
        weight = 10
    [[menu.main]]
        name = 'ContentDB'
        url = 'https://content.luanti.org/'
        weight = 20
    [[menu.main]]
        name = 'Forums'
        url = 'https://forum.luanti.org/'
        weight = 30
    [[menu.main]]
        name = 'Search'
        weight = 40
        params = { type = 'search' }
    [[menu.main]]
        name = 'GitHub'
        url = 'https://github.com/luanti-org/docs.luanti.org'
        weight = 50
        params = { icon = 'github' }

# Docs layout (side menu, ToC) for all pages
[[cascade]]
    type = 'docs'

# Pages mounted from other repos (see [module] below) are edited there
[[cascade]]
    [cascade.params]
        editURL = 'https://github.com/luanti-org/flint/tree/master/docs'
    [cascade.target]
        path = '{/for-creators/flint,/for-creators/flint/**}'
[[cascade]]
    [cascade.params]
        editURL = 'https://github.com/luanti-org/luma/tree/main/docs'
    [cascade.target]
        path = '{/for-server-hosts/luma,/for-server-hosts/luma/**}'

[module]
    [[module.mounts]]
        source = 'content'
        target = 'content'
    [[module.mounts]]
        source = 'external/flint/docs'
        target = 'content/for-creators/flint'
    [[module.mounts]]
        source = 'external/luma/docs'
        target = 'content/for-server-hosts/luma'
